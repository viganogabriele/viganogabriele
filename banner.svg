<svg width="700" height="140" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00d4ff">
        <animate attributeName="offset" values="0; 1.05; 1.05" keyTimes="0; 0.7; 1" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0">
        <animate attributeName="offset" values="0.05; 1.1; 1.1" keyTimes="0; 0.7; 1" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .name {
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 2px;
      }
    </style>
  </defs>
  <text x="50%" y="58%" text-anchor="middle" class="name" fill="url(#shimmer)">Gabriele</text>
</svg>
